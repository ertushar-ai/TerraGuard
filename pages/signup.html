<!DOCTYPE html>

<head>

    <title>Sign Up | TerraGuard</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">

    <script>
        if (window.location.hostname) {

        <section class="auth-card">

            <div class="auth-header">
                <a href="../index.html" class="auth-logo">
                    🌍 TerraGuard
                </a>
                <h1>Create Account</h1>
                <p>Create your TerraGuard account to receive personalized disaster alerts.</p>
            </div>

            <form id="signup-form" class="auth-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Minimum 8 characters" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>
                </div>

                <div id="signup-message" class="auth-message" style="display: none;"></div>

                <button type="submit" class="auth-submit">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
                <a href="../index.html">← Back to TerraGuard</a>
            </div>

        </section>

    </main>

</body>
